<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="credit-journey-title credit-journey-desc">
  <title id="credit-journey-title">MediaHedge credit journey</title>
  <desc id="credit-journey-desc">Seven connected stages move from proving full financing through underwriting, sizing, closing, servicing, recovery, and portfolio reporting.</desc>
  <defs>
    <marker id="credit-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12adbd"/></marker>
    <style>
      .bg{fill:#fff}.eyebrow{font:700 15px Aptos,Segoe UI,Arial,sans-serif;letter-spacing:2px;fill:#176b73}.title{font:750 34px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f}.sub{font:400 18px Aptos,Segoe UI,Arial,sans-serif;fill:#52636b}.step{fill:#f7fbfb;stroke:#bdd9dc;stroke-width:2}.num{fill:#12adbd}.numtext{font:750 15px Aptos,Segoe UI,Arial,sans-serif;fill:#fff;text-anchor:middle}.label{font:750 18px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f;text-anchor:middle}.detail{font:400 14px Aptos,Segoe UI,Arial,sans-serif;fill:#52636b;text-anchor:middle}.arrow{fill:none;stroke:#12adbd;stroke-width:3;marker-end:url(#credit-arrow)}.rail{fill:#0c224f}.railtitle{font:750 16px Aptos,Segoe UI,Arial,sans-serif;fill:#fff}.railtext{font:400 15px Aptos,Segoe UI,Arial,sans-serif;fill:#d7eef0}
    </style>
  </defs>
  <rect class="bg" width="1200" height="520" rx="24"/>
  <text class="eyebrow" x="54" y="58">THE MEDIAHEDGE CREDIT JOURNEY</text>
  <text class="title" x="54" y="101">From Financeability to Realized Performance</text>
  <text class="sub" x="54" y="134">Each stage produces evidence and a decision—not just another document.</text>
  <path class="arrow" d="M186 258H214"/><path class="arrow" d="M346 258H374"/><path class="arrow" d="M506 258H534"/><path class="arrow" d="M666 258H694"/><path class="arrow" d="M826 258H854"/><path class="arrow" d="M986 258H1014"/>
  <g transform="translate(54 174)"><rect class="step" width="132" height="168" rx="16"/><circle class="num" cx="66" cy="34" r="18"/><text class="numtext" x="66" y="39">1</text><text class="label" x="66" y="79">Prove</text><text class="detail" x="66" y="108"><tspan x="66">Full financing</tspan><tspan x="66" dy="21">and delivery</tspan></text></g>
  <g transform="translate(214 174)"><rect class="step" width="132" height="168" rx="16"/><circle class="num" cx="66" cy="34" r="18"/><text class="numtext" x="66" y="39">2</text><text class="label" x="66" y="79">Underwrite</text><text class="detail" x="66" y="108"><tspan x="66">Eligible net</tspan><tspan x="66" dy="21">collateral</tspan></text></g>
  <g transform="translate(374 174)"><rect class="step" width="132" height="168" rx="16"/><circle class="num" cx="66" cy="34" r="18"/><text class="numtext" x="66" y="39">3</text><text class="label" x="66" y="79">Size</text><text class="detail" x="66" y="108"><tspan x="66">Tightest limit</tspan><tspan x="66" dy="21">controls</tspan></text></g>
  <g transform="translate(534 174)"><rect class="step" width="132" height="168" rx="16"/><circle class="num" cx="66" cy="34" r="18"/><text class="numtext" x="66" y="39">4</text><text class="label" x="66" y="79">Close</text><text class="detail" x="66" y="108"><tspan x="66">Rights and</tspan><tspan x="66" dy="21">cash path</tspan></text></g>
  <g transform="translate(694 174)"><rect class="step" width="132" height="168" rx="16"/><circle class="num" cx="66" cy="34" r="18"/><text class="numtext" x="66" y="39">5</text><text class="label" x="66" y="79">Service</text><text class="detail" x="66" y="108"><tspan x="66">Evidence and</tspan><tspan x="66" dy="21">triggers</tspan></text></g>
  <g transform="translate(854 174)"><rect class="step" width="132" height="168" rx="16"/><circle class="num" cx="66" cy="34" r="18"/><text class="numtext" x="66" y="39">6</text><text class="label" x="66" y="79">Recover</text><text class="detail" x="66" y="108"><tspan x="66">Preserve net</tspan><tspan x="66" dy="21">value</tspan></text></g>
  <g transform="translate(1014 174)"><rect class="step" width="132" height="168" rx="16"/><circle class="num" cx="66" cy="34" r="18"/><text class="numtext" x="66" y="39">7</text><text class="label" x="66" y="79">Report</text><text class="detail" x="66" y="108"><tspan x="66">Portfolio and</tspan><tspan x="66" dy="21">return</tspan></text></g>
  <rect class="rail" x="54" y="389" width="1092" height="78" rx="16"/>
  <text class="railtitle" x="82" y="421">Shared dependencies</text><text class="railtext" x="82" y="447">Completion and delivery</text><circle cx="326" cy="442" r="4" fill="#12adbd"/><text class="railtext" x="346" y="447">Reachable collateral</text><circle cx="548" cy="442" r="4" fill="#12adbd"/><text class="railtext" x="568" y="447">Controlled cash</text><circle cx="738" cy="442" r="4" fill="#12adbd"/><text class="railtext" x="758" y="447">Timely evidence</text><circle cx="930" cy="442" r="4" fill="#12adbd"/><text class="railtext" x="950" y="447">Decision rights</text>
</svg>

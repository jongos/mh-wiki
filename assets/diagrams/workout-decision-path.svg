<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="workout-title workout-desc">
  <title id="workout-title">Workout decision path</title>
  <desc id="workout-desc">A stress signal leads to triage, failure-mode diagnosis, three value-preservation paths, governed execution, and net recovery accounting.</desc>
  <defs><marker id="workout-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12adbd"/></marker><style>.bg{fill:#fff}.eyebrow{font:700 15px Aptos,Segoe UI,Arial,sans-serif;letter-spacing:2px;fill:#176b73}.title{font:750 32px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f}.box{fill:#f7fbfb;stroke:#bdd9dc;stroke-width:2}.accent{fill:#edf7f7;stroke:#12adbd;stroke-width:3}.dark{fill:#0c224f}.label{font:750 18px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f;text-anchor:middle}.detail{font:400 14px Aptos,Segoe UI,Arial,sans-serif;fill:#52636b;text-anchor:middle}.white{font:750 18px Aptos,Segoe UI,Arial,sans-serif;fill:#fff;text-anchor:middle}.whitesub{font:400 14px Aptos,Segoe UI,Arial,sans-serif;fill:#d7eef0;text-anchor:middle}.arrow{fill:none;stroke:#12adbd;stroke-width:3;marker-end:url(#workout-arrow)}.note{font:700 16px Aptos,Segoe UI,Arial,sans-serif;fill:#9b571c;text-anchor:middle}</style></defs>
  <rect class="bg" width="1200" height="700" rx="24"/><text class="eyebrow" x="54" y="58">VALUE-PRESERVATION PATH</text><text class="title" x="54" y="99">Diagnose the Failure Before Choosing the Remedy</text>
  <g transform="translate(55 160)"><rect class="box" width="180" height="100" rx="16"/><text class="label" x="90" y="41">Stress Signal</text><text class="detail" x="90" y="69">Variance or breach</text></g><path class="arrow" d="M235 210H305"/>
  <g transform="translate(305 160)"><rect class="accent" width="210" height="100" rx="16"/><text class="label" x="105" y="38">Triage</text><text class="detail" x="105" y="66"><tspan x="105">Verify facts and preserve</tspan><tspan x="105" dy="20">rights, records, and cash</tspan></text></g><path class="arrow" d="M515 210H585"/>
  <g transform="translate(585 145)"><rect class="dark" width="250" height="130" rx="20"/><text class="white" x="125" y="44">Failure-Mode Diagnosis</text><text class="whitesub" x="125" y="75"><tspan x="125">Liquidity, documentation,</tspan><tspan x="125" dy="21">performance, obligor,</tspan><tspan x="125" dy="21">or collateral impairment</tspan></text></g>
  <path class="arrow" d="M710 275V335H250V385"/><path class="arrow" d="M710 275V385"/><path class="arrow" d="M710 335H1015V385"/>
  <g transform="translate(120 385)"><rect class="box" width="260" height="120" rx="18"/><text class="label" x="130" y="38">Temporary Liquidity</text><text class="detail" x="130" y="70"><tspan x="130">Cure, reserve, extension,</tspan><tspan x="130" dy="21">or protective-advance test</tspan></text></g>
  <g transform="translate(580 385)"><rect class="box" width="260" height="120" rx="18"/><text class="label" x="130" y="38">Control or Documentation</text><text class="detail" x="130" y="70"><tspan x="130">Remediate, notify, block,</tspan><tspan x="130" dy="21">and preserve parallel rights</tspan></text></g>
  <g transform="translate(890 385)"><rect class="box" width="260" height="120" rx="18"/><text class="label" x="130" y="38">Value Impairment</text><text class="detail" x="130" y="70"><tspan x="130">Stabilize and compare sale,</tspan><tspan x="130" dy="21">takeover, or enforcement</tspan></text></g>
  <path class="arrow" d="M250 505V555H500"/><path class="arrow" d="M710 505V555H610"/><path class="arrow" d="M1020 505V555H720"/>
  <g transform="translate(500 525)"><rect class="accent" width="220" height="98" rx="18"/><text class="label" x="110" y="38">Governed Execution</text><text class="detail" x="110" y="66">Authority + net recovery</text></g><path class="arrow" d="M720 574H880"/>
  <g transform="translate(880 525)"><rect class="dark" width="250" height="98" rx="18"/><text class="white" x="125" y="38">Recovery Accounting</text><text class="whitesub" x="125" y="66">Cash, cost, time, and priority</text></g>
  <text class="note" x="600" y="669">The best remedy is the governed path with the strongest risk-adjusted net present recovery.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="return-title return-desc">
  <title id="return-title">Return economics bridge</title>
  <desc id="return-desc">A conceptual bridge shows how coupon and fees are transformed by dated cash timing, extensions, losses, servicing costs, and funding effects into realized XIRR and cash multiple.</desc>
  <defs><marker id="return-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12adbd"/></marker><style>.bg{fill:#fff}.eyebrow{font:700 15px Aptos,Segoe UI,Arial,sans-serif;letter-spacing:2px;fill:#176b73}.title{font:750 32px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f}.box{fill:#f7fbfb;stroke:#bdd9dc;stroke-width:2}.dark{fill:#0c224f}.label{font:750 17px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f;text-anchor:middle}.detail{font:400 14px Aptos,Segoe UI,Arial,sans-serif;fill:#52636b;text-anchor:middle}.white{font:750 19px Aptos,Segoe UI,Arial,sans-serif;fill:#fff;text-anchor:middle}.whitesub{font:400 14px Aptos,Segoe UI,Arial,sans-serif;fill:#d7eef0;text-anchor:middle}.arrow{fill:none;stroke:#12adbd;stroke-width:3;marker-end:url(#return-arrow)}.driver{font:750 12px Aptos,Segoe UI,Arial,sans-serif;letter-spacing:1px;fill:#176b73;text-anchor:middle}.friction{font:750 12px Aptos,Segoe UI,Arial,sans-serif;letter-spacing:1px;fill:#b7661d;text-anchor:middle}.note{font:700 16px Aptos,Segoe UI,Arial,sans-serif;fill:#9b571c;text-anchor:middle}</style></defs>
  <rect class="bg" width="1200" height="680" rx="24"/><text class="eyebrow" x="54" y="58">DATED CASH, NOT HEADLINE YIELD</text><text class="title" x="54" y="99">The Bridge from Contract Terms to Realized Return</text>
  <g transform="translate(50 220)"><rect class="dark" width="210" height="170" rx="20"/><text class="white" x="105" y="52">Contract Economics</text><text class="whitesub" x="105" y="88"><tspan x="105">Coupon</tspan><tspan x="105" dy="23">Fees and OID</tspan><tspan x="105" dy="23">Defined balance</tspan></text></g><path class="arrow" d="M260 305H315"/>
  <g transform="translate(315 160)"><text class="driver" x="90" y="24">TIMING DRIVER</text><rect class="box" y="44" width="180" height="120" rx="16"/><text class="label" x="90" y="87">Cash Timing</text><text class="detail" x="90" y="116"><tspan x="90">Draws, amortization,</tspan><tspan x="90" dy="20">and prepayment</tspan></text></g>
  <g transform="translate(515 160)"><text class="friction" x="90" y="24">FRICTION</text><rect class="box" y="44" width="180" height="120" rx="16"/><text class="label" x="90" y="87">Delay</text><text class="detail" x="90" y="116"><tspan x="90">Extensions and</tspan><tspan x="90" dy="20">slower collections</tspan></text></g>
  <g transform="translate(715 160)"><text class="friction" x="90" y="24">FRICTION</text><rect class="box" y="44" width="180" height="120" rx="16"/><text class="label" x="90" y="87">Credit Cost</text><text class="detail" x="90" y="116"><tspan x="90">Nonaccrual, loss,</tspan><tspan x="90" dy="20">and recovery timing</tspan></text></g>
  <g transform="translate(415 380)"><text class="friction" x="90" y="24">FRICTION</text><rect class="box" y="44" width="180" height="120" rx="16"/><text class="label" x="90" y="87">Operating Cost</text><text class="detail" x="90" y="116"><tspan x="90">Servicing, legal,</tspan><tspan x="90" dy="20">and recovery expense</tspan></text></g>
  <g transform="translate(615 380)"><text class="friction" x="90" y="24">FRICTION</text><rect class="box" y="44" width="180" height="120" rx="16"/><text class="label" x="90" y="87">Capital Effects</text><text class="detail" x="90" y="116"><tspan x="90">Funding cost and</tspan><tspan x="90" dy="20">idle-capital drag</tspan></text></g>
  <path class="arrow" d="M895 264H955V305H980"/><path class="arrow" d="M795 484H925V360H980"/>
  <g transform="translate(980 220)"><rect class="dark" width="170" height="170" rx="20"/><text class="white" x="85" y="51"><tspan x="85">Realized Cash</tspan><tspan x="85" dy="23">Outcome</tspan></text><text class="whitesub" x="85" y="113"><tspan x="85">XIRR</tspan><tspan x="85" dy="22">Cash multiple</tspan></text></g>
  <path d="M315 552H895" stroke="#bdd9dc" stroke-width="2"/><text class="detail" x="605" y="585">Reconcile the dated investor ledger to controlled-account cash and recovery accounting.</text>
  <text class="note" x="600" y="638">A stated coupon is an input; it is not the financier's realized return.</text>
</svg>

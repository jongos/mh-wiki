<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="monitor-title monitor-desc">
  <title id="monitor-title">Monitoring baseline-to-action loop</title>
  <desc id="monitor-desc">A recurring loop moves from the approved baseline through evidence, comparison, exception diagnosis, decision, and an updated credit view.</desc>
  <defs><marker id="monitor-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12adbd"/></marker><style>.bg{fill:#fff}.eyebrow{font:700 15px Aptos,Segoe UI,Arial,sans-serif;letter-spacing:2px;fill:#176b73}.title{font:750 32px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f}.node{fill:#f7fbfb;stroke:#bdd9dc;stroke-width:2}.accent{fill:#0c224f}.label{font:750 18px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f;text-anchor:middle}.detail{font:400 14px Aptos,Segoe UI,Arial,sans-serif;fill:#52636b;text-anchor:middle}.white{font:750 20px Aptos,Segoe UI,Arial,sans-serif;fill:#fff;text-anchor:middle}.whitesub{font:400 14px Aptos,Segoe UI,Arial,sans-serif;fill:#d7eef0;text-anchor:middle}.arrow{fill:none;stroke:#12adbd;stroke-width:3;marker-end:url(#monitor-arrow)}.note{font:700 16px Aptos,Segoe UI,Arial,sans-serif;fill:#9b571c;text-anchor:middle}</style></defs>
  <rect class="bg" width="1200" height="680" rx="24"/><text class="eyebrow" x="54" y="58">BASELINE-TO-ACTION LOOP</text><text class="title" x="54" y="99">Monitoring Turns Changing Facts into Decisions</text>
  <path class="arrow" d="M303 235C380 155 468 130 535 150"/><path class="arrow" d="M675 150C764 124 870 164 907 244"/><path class="arrow" d="M950 330C960 421 895 500 807 526"/><path class="arrow" d="M680 550C592 584 490 563 425 502"/><path class="arrow" d="M340 441C270 392 245 316 281 248"/>
  <g transform="translate(142 206)"><rect class="node" width="190" height="112" rx="18"/><text class="label" x="95" y="42">1. Baseline</text><text class="detail" x="95" y="72"><tspan x="95">Budget, schedule,</tspan><tspan x="95" dy="20">borrowing base, cash</tspan></text></g>
  <g transform="translate(505 116)"><rect class="node" width="190" height="112" rx="18"/><text class="label" x="95" y="42">2. Evidence</text><text class="detail" x="95" y="72"><tspan x="95">Reports, contracts,</tspan><tspan x="95" dy="20">bank and claims data</tspan></text></g>
  <g transform="translate(868 206)"><rect class="node" width="190" height="112" rx="18"/><text class="label" x="95" y="42">3. Compare</text><text class="detail" x="95" y="72"><tspan x="95">Value, timing,</tspan><tspan x="95" dy="20">coverage and covenants</tspan></text></g>
  <g transform="translate(760 474)"><rect class="node" width="220" height="112" rx="18"/><text class="label" x="110" y="42">4. Diagnose</text><text class="detail" x="110" y="72"><tspan x="110">Severity, owner, cure date</tspan><tspan x="110" dy="20">and decision consequence</tspan></text></g>
  <g transform="translate(220 454)"><rect class="node" width="230" height="132" rx="18"/><text class="label" x="115" y="42">5. Decide and Update</text><text class="detail" x="115" y="72"><tspan x="115">Draw, reserve, consent,</tspan><tspan x="115" dy="20">notice, reforecast, workout</tspan></text></g>
  <g transform="translate(455 282)"><rect class="accent" width="290" height="150" rx="75"/><text class="white" x="145" y="60">Current Credit View</text><text class="whitesub" x="145" y="93"><tspan x="145">Eligible value + cash timing</tspan><tspan x="145" dy="22">+ authority + expected return</tspan></text></g>
  <text class="note" x="600" y="638">More reports are not more control unless evidence is timely, verified, owned, and connected to action.</text>
</svg>

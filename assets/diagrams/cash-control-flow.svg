<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="cash-title cash-desc">
  <title id="cash-title">Cash control and waterfall flow</title>
  <desc id="cash-desc">Payment sources are directed into a controlled collection account, administered under a CAMA and account control arrangement, then reconciled and distributed through the contractual waterfall.</desc>
  <defs><marker id="cash-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12adbd"/></marker><style>.bg{fill:#fff}.eyebrow{font:700 15px Aptos,Segoe UI,Arial,sans-serif;letter-spacing:2px;fill:#176b73}.title{font:750 32px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f}.box{fill:#f7fbfb;stroke:#bdd9dc;stroke-width:2}.accent{fill:#edf7f7;stroke:#12adbd;stroke-width:3}.dark{fill:#0c224f}.label{font:750 18px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f;text-anchor:middle}.detail{font:400 14px Aptos,Segoe UI,Arial,sans-serif;fill:#52636b;text-anchor:middle}.white{font:750 18px Aptos,Segoe UI,Arial,sans-serif;fill:#fff;text-anchor:middle}.whitesub{font:400 14px Aptos,Segoe UI,Arial,sans-serif;fill:#d7eef0;text-anchor:middle}.arrow{fill:none;stroke:#12adbd;stroke-width:3;marker-end:url(#cash-arrow)}.dash{fill:none;stroke:#7ca9ad;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#cash-arrow)}.note{font:700 15px Aptos,Segoe UI,Arial,sans-serif;fill:#9b571c;text-anchor:middle}</style></defs>
  <rect class="bg" width="1200" height="650" rx="24"/>
  <text class="eyebrow" x="54" y="58">CASH CONTROL</text><text class="title" x="54" y="99">From Payment Obligation to Captured Repayment</text>
  <g transform="translate(50 190)"><rect class="box" width="180" height="82" rx="14"/><text class="label" x="90" y="34">Distributor</text><text class="detail" x="90" y="58">Contract payment</text><rect class="box" y="104" width="180" height="82" rx="14"/><text class="label" x="90" y="138">Incentive</text><text class="detail" x="90" y="162">Refund or transfer</text><rect class="box" y="208" width="180" height="82" rx="14"/><text class="label" x="90" y="242">Other Obligor</text><text class="detail" x="90" y="266">Approved proceeds</text></g>
  <path class="arrow" d="M230 231H300V335H360"/><path class="arrow" d="M230 335H360"/><path class="arrow" d="M230 439H300V335H360"/>
  <g transform="translate(360 260)"><rect class="accent" width="250" height="150" rx="20"/><text class="label" x="125" y="54"><tspan x="125">Controlled Collection</tspan><tspan x="125" dy="24">Account</tspan></text><text class="detail" x="125" y="112">Approved bank destination</text></g>
  <g transform="translate(355 152)"><rect class="box" width="120" height="70" rx="14"/><text class="label" x="60" y="31">CAMA</text><text class="detail" x="60" y="53">Allocation</text></g><path class="dash" d="M415 222V257"/>
  <g transform="translate(495 152)"><rect class="box" width="120" height="70" rx="14"/><text class="label" x="60" y="31">Control</text><text class="detail" x="60" y="53">Bank rights</text></g><path class="dash" d="M555 222V257"/>
  <path class="arrow" d="M610 335H690"/>
  <g transform="translate(690 260)"><rect class="dark" width="190" height="150" rx="20"/><text class="white" x="95" y="50">Waterfall</text><text class="whitesub" x="95" y="84"><tspan x="95">Deductions</tspan><tspan x="95" dy="21">Principal</tspan><tspan x="95" dy="21">Interest and fees</tspan></text></g>
  <path class="arrow" d="M880 304H960"/><path class="arrow" d="M880 366H960"/>
  <g transform="translate(960 245)"><rect class="accent" width="190" height="96" rx="16"/><text class="label" x="95" y="39">Financier</text><text class="detail" x="95" y="67">Senior repayment</text><rect class="box" y="125" width="190" height="96" rx="16"/><text class="label" x="95" y="164">Residual</text><text class="detail" x="95" y="192">Permitted distributions</text></g>
  <path class="dash" d="M785 410V532H485V414"/><text class="detail" x="635" y="560">Reconciliation connects bank cash, allocations, distributions, and the loan ledger.</text>
  <text class="note" x="600" y="614">Payment direction, CAMA, account control, waterfall, and reconciliation are distinct controls.</text>
</svg>

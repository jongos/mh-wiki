<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="stack-title stack-desc">
  <title id="stack-title">MediaHedge protection stack</title>
  <desc id="stack-desc">Five distinct protection layers cover eligibility, sizing, priority and cash control, completion and risk transfer, and surveillance and enforcement.</desc>
  <defs><style>.bg{fill:#fff}.eyebrow{font:700 15px Aptos,Segoe UI,Arial,sans-serif;letter-spacing:2px;fill:#176b73}.title{font:750 32px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f}.layer{stroke:#fff;stroke-width:3}.light{font:750 20px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f}.white{font:750 20px Aptos,Segoe UI,Arial,sans-serif;fill:#fff}.detail{font:400 15px Aptos,Segoe UI,Arial,sans-serif;fill:#52636b}.detailw{font:400 15px Aptos,Segoe UI,Arial,sans-serif;fill:#e7f5f6}.risk{fill:#f7fbfb;stroke:#bdd9dc;stroke-width:2}.riskhead{font:750 17px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f}.risktext{font:400 14px Aptos,Segoe UI,Arial,sans-serif;fill:#52636b}.note{font:700 16px Aptos,Segoe UI,Arial,sans-serif;fill:#9b571c;text-anchor:middle}</style></defs>
  <rect class="bg" width="1200" height="680" rx="24"/>
  <text class="eyebrow" x="54" y="58">LAYERED CREDIT PROTECTION</text><text class="title" x="54" y="99">Each Layer Addresses a Different Failure Mode</text>
  <g transform="translate(65 160)">
    <rect class="layer" width="670" height="82" rx="14" fill="#dceff0"/><text class="light" x="28" y="34">1. Eligibility and Verification</text><text class="detail" x="28" y="60">Only supported, enforceable value enters the borrowing base.</text>
    <rect class="layer" y="82" width="670" height="82" rx="14" fill="#bfe4e7"/><text class="light" x="28" y="116">2. Sizing and Structural Subordination</text><text class="detail" x="28" y="142">Haircuts, limits, reserves, and tenor create cushion.</text>
    <rect class="layer" y="164" width="670" height="82" rx="14" fill="#79cad1"/><text class="light" x="28" y="198">3. Priority and Cash Control</text><text class="detail" x="28" y="224">Rights become reachable; proceeds become capturable.</text>
    <rect class="layer" y="246" width="670" height="82" rx="14" fill="#2398a4"/><text class="white" x="28" y="280">4. Completion and Risk Transfer</text><text class="detailw" x="28" y="306">Specific protection for delivery and covered events.</text>
    <rect class="layer" y="328" width="670" height="82" rx="14" fill="#0c224f"/><text class="white" x="28" y="362">5. Surveillance and Enforcement</text><text class="detailw" x="28" y="388">Changing risk becomes a decision while options remain.</text>
  </g>
  <g transform="translate(790 160)"><rect class="risk" width="340" height="410" rx="20"/><text class="riskhead" x="28" y="45">Examples of the Risks Addressed</text><circle cx="34" cy="88" r="6" fill="#12adbd"/><text class="risktext" x="52" y="93">Unsupported or duplicated collateral</text><circle cx="34" cy="132" r="6" fill="#12adbd"/><text class="risktext" x="52" y="137">Excess exposure or weak cushion</text><circle cx="34" cy="176" r="6" fill="#12adbd"/><text class="risktext" x="52" y="181">Priority failure or cash diversion</text><circle cx="34" cy="220" r="6" fill="#12adbd"/><text class="risktext" x="52" y="225">Failure to deliver or covered loss</text><circle cx="34" cy="264" r="6" fill="#12adbd"/><text class="risktext" x="52" y="269">Deterioration, default, or agency failure</text><path d="M28 312H312" stroke="#bdd9dc" stroke-width="2"/><text class="riskhead" x="28" y="348">Integration Rule</text><text class="risktext" x="28" y="380"><tspan x="28">Documents, accounts, and operations must</tspan><tspan x="28" dy="22">describe the same collateral and authority.</tspan></text></g>
  <text class="note" x="600" y="630">No layer substitutes for another, and duplicate documents do not create independent recovery.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="portfolio-title portfolio-desc">
  <title id="portfolio-title">Portfolio concentration map</title>
  <desc id="portfolio-desc">A portfolio exposure is connected to common failure drivers including obligor, jurisdiction, guarantor, account bank, producer, market, delivery dependency, and maturity window.</desc>
  <defs><style>.bg{fill:#fff}.eyebrow{font:700 15px Aptos,Segoe UI,Arial,sans-serif;letter-spacing:2px;fill:#176b73}.title{font:750 32px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f}.node{fill:#f7fbfb;stroke:#bdd9dc;stroke-width:2}.center{fill:#0c224f;stroke:#12adbd;stroke-width:4}.label{font:750 17px Aptos,Segoe UI,Arial,sans-serif;fill:#0c224f;text-anchor:middle}.detail{font:400 13px Aptos,Segoe UI,Arial,sans-serif;fill:#52636b;text-anchor:middle}.white{font:750 21px Aptos,Segoe UI,Arial,sans-serif;fill:#fff;text-anchor:middle}.whitesub{font:400 14px Aptos,Segoe UI,Arial,sans-serif;fill:#d7eef0;text-anchor:middle}.line{stroke:#7ca9ad;stroke-width:2}.note{font:700 16px Aptos,Segoe UI,Arial,sans-serif;fill:#9b571c;text-anchor:middle}</style></defs>
  <rect class="bg" width="1200" height="700" rx="24"/><text class="eyebrow" x="54" y="58">COMMON-FACTOR RISK</text><text class="title" x="54" y="99">Count Failure Drivers, Not Just Deals</text>
  <line class="line" x1="600" y1="354" x2="210" y2="190"/><line class="line" x1="600" y1="354" x2="480" y2="174"/><line class="line" x1="600" y1="354" x2="780" y2="174"/><line class="line" x1="600" y1="354" x2="1010" y2="220"/><line class="line" x1="600" y1="354" x2="1010" y2="500"/><line class="line" x1="600" y1="354" x2="760" y2="560"/><line class="line" x1="600" y1="354" x2="440" y2="560"/><line class="line" x1="600" y1="354" x2="190" y2="480"/>
  <g transform="translate(95 140)"><rect class="node" width="230" height="100" rx="18"/><text class="label" x="115" y="39">Obligor or Platform</text><text class="detail" x="115" y="68">Shared payment capacity</text></g>
  <g transform="translate(365 124)"><rect class="node" width="230" height="100" rx="18"/><text class="label" x="115" y="39">Jurisdiction</text><text class="detail" x="115" y="68">Program and legal exposure</text></g>
  <g transform="translate(665 124)"><rect class="node" width="230" height="100" rx="18"/><text class="label" x="115" y="39">Guarantor or Insurer</text><text class="detail" x="115" y="68">Provider concentration</text></g>
  <g transform="translate(910 170)"><rect class="node" width="230" height="100" rx="18"/><text class="label" x="115" y="39">Account Bank</text><text class="detail" x="115" y="68">Operational dependency</text></g>
  <g transform="translate(910 450)"><rect class="node" width="230" height="100" rx="18"/><text class="label" x="115" y="39">Producer or Agent</text><text class="detail" x="115" y="68">Execution concentration</text></g>
  <g transform="translate(645 510)"><rect class="node" width="230" height="100" rx="18"/><text class="label" x="115" y="39">Sales Market</text><text class="detail" x="115" y="68">Demand and liquidity</text></g>
  <g transform="translate(325 510)"><rect class="node" width="230" height="100" rx="18"/><text class="label" x="115" y="39">Delivery Dependency</text><text class="detail" x="115" y="68">Shared project milestone</text></g>
  <g transform="translate(75 430)"><rect class="node" width="230" height="100" rx="18"/><text class="label" x="115" y="39">Maturity Window</text><text class="detail" x="115" y="68">Funding and liquidity need</text></g>
  <g transform="translate(455 284)"><circle class="center" cx="145" cy="100" r="118"/><text class="white" x="145" y="88">Portfolio Exposure</text><text class="whitesub" x="145" y="119"><tspan x="145">Funded + undrawn</tspan><tspan x="145" dy="21">+ stressed loss contribution</tspan></text></g>
  <text class="note" x="600" y="662">Different titles, SPVs, or collateral labels may still depend on the same economic event.</text>
</svg>
